name: Build & Release Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh

      - name: Pasang core ESP32 dan library
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"

      - name: Kompilasi firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 firmware/detak_jantung --output-dir build
          cp build/detak_jantung.ino.bin build/firmware.bin

      - name: Simpan hasil build (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/firmware.bin

      - name: Rilis ke GitHub Releases (hanya saat tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/firmware.bin
          body: |
            Firmware alat pemantau detak jantung low-cost.
            File firmware.bin dipakai untuk OTA: ESP32 mengunduh file ini
            langsung dari GitHub Releases.
